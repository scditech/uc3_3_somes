name: Validate and organize repo, build and publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - "config.toml"
      - "pieces/**"
      - "dependencies/**"

permissions:
  contents: write
  packages: write

jobs:
  validate-and-organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Pip install packages
        run: |
          python -m pip install -U pip
          pip install --no-cache-dir domino-py[cli]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run organize and build images
        run: |
          domino piece organize --build-images --source-url=https://github.com/${{ github.repository }}

      - name: Publish images
        env:
          GHCR_USERNAME: ${{ github.actor }}
        run: domino piece publish-images --registry-token ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push auto-organize
        id: commit_files
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          GIT_STATUS=$(git status -s)
          if [[ -z "$GIT_STATUS" ]]; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .domino/*
          git commit -m "auto-organize" -a
          # Avoid race with other pushes to main during long image builds.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import re, pathlib; t=pathlib.Path('config.toml').read_text(encoding='utf-8'); print(re.search(r'VERSION\\s*=\\s*\\\"([^\\\"]+)\\\"', t).group(1))")
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists — skipping release."
          else
            domino piece release
          fi
